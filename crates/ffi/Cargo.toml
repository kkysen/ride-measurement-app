[package]
name = "ride-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# The Rust code the Android app (and later iOS) calls, via `uniffi`-generated bindings.
[lib]
name = "ride_ffi"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.32.2", features = ["cli"] }
