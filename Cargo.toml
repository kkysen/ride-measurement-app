[workspace]
resolver = "3"
members = ["crates/session", "crates/fusion", "crates/cli", "crates/py", "crates/ffi"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
prost = "0.14.4"
prost-build = "0.14.4"
protox = "0.10.0"
ride-fusion = { path = "crates/fusion" }
ride-session = { path = "crates/session" }
tempfile = "3"
zstd = "0.14.3"
