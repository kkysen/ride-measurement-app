[workspace]
resolver = "3"
members = ["crates/session", "crates/gnss", "crates/fusion", "crates/cli", "crates/py", "crates/ffi"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
# Zone rules from its bundled IANA database, so the phone and a computer agree (see `ride_session::clock`).
jiff = { version = "0.2.45", default-features = false, features = ["std", "tzdb-bundle-always"] }
prost = "0.14.4"
prost-build = "0.14.4"
protox = "0.10.0"
ride-fusion = { path = "crates/fusion" }
ride-gnss = { path = "crates/gnss" }
ride-session = { path = "crates/session" }
rustfft = "6.4.1"
tempfile = "3"
zstd = "0.14.3"
