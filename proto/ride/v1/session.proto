// Session format, version 1.
//
// A session is a directory:
// - `session.pb`: one length-delimited `SessionInfo`.
// - `<stream>.zst` for each stream in `SessionInfo.streams`:
//   a concatenation of independent zstd frames, each holding exactly one length-delimited chunk:
//   a `SensorChunk` for `STREAM_KIND_SENSOR` streams, a `RecordChunk` for `STREAM_KIND_RECORDS` streams,
//   an `AudioChunk` for `STREAM_KIND_AUDIO` streams.
//   Frames are self-contained, so a crash loses at most the frame being written.
//
// Length-delimited means a varint byte length followed by the message, as in `writeDelimitedTo`.
// All values are stored bit-exactly: decoding must return exactly what Android delivered.
syntax = "proto3";

package ride.v1;

option java_package = "dev.khyber.ride.proto";
option java_multiple_files = true;

message SessionInfo {
  uint32 format_version = 1;
  string session_id = 2;
  // Wall clock at the start, for humans; analysis uses `start_elapsed_realtime_ns`.
  int64 start_unix_ms = 3;
  // `SystemClock.elapsedRealtimeNanos()` at the start, sampled together with `start_unix_ms`.
  int64 start_elapsed_realtime_ns = 4;
  Device device = 5;
  repeated StreamInfo streams = 6;
  // Set when Android killed the recording and it restarted itself: the session this one continues.
  string continues_session_id = 7;
}

message Device {
  string manufacturer = 1;
  string model = 2;
  int32 sdk_int = 3;
  string build_fingerprint = 4;
}

enum StreamKind {
  STREAM_KIND_SENSOR = 0;
  STREAM_KIND_RECORDS = 1;
  STREAM_KIND_AUDIO = 2;
}

message StreamInfo {
  // File name without the `.zst` extension.
  string name = 1;
  // Set for sensor streams.
  SensorInfo sensor = 2;
  StreamKind kind = 3;
  // Set for audio streams.
  AudioInfo audio = 4;
}

message AudioInfo {
  int32 sample_rate_hz = 1;
  int32 channels = 2;
  // `MediaRecorder.AudioSource` constant; `UNPROCESSED` when supported, so no gain control or noise suppression.
  int32 audio_source = 3;
  string audio_source_name = 4;
}

// Everything `android.hardware.Sensor` reports, recorded as-is.
message SensorInfo {
  int32 type = 1;
  string string_type = 2;
  string name = 3;
  string vendor = 4;
  int32 version = 5;
  float resolution = 6;
  float maximum_range = 7;
  float power_ma = 8;
  int32 min_delay_us = 9;
  int32 max_delay_us = 10;
  int32 fifo_max_event_count = 11;
  int32 fifo_reserved_event_count = 12;
  int32 reporting_mode = 13;
  bool wake_up = 14;
  // Requested sampling period and batching latency.
  int32 sampling_period_us = 15;
  int32 max_report_latency_us = 16;
}

message SensorChunk {
  // `SensorEvent.timestamp` of each sample: the first is absolute, each later one is the difference from the previous.
  repeated sint64 timestamp_deltas_ns = 1;
  uint32 values_per_sample = 2;
  // IEEE 754 bits of `SensorEvent.values`, sample after sample, `values_per_sample` each.
  repeated fixed32 value_bits = 3;
  // `SensorEvent.accuracy` of each sample.
  repeated int32 accuracy = 4;
  // `SystemClock.elapsedRealtimeNanos()` when the chunk was written, to check the sensor timestamp base.
  int64 written_elapsed_realtime_ns = 5;
}

message RecordChunk {
  repeated Record records = 1;
  int64 written_elapsed_realtime_ns = 2;
}

// One event from a non-sensor Android API, stored as close to what Android delivered as practical.
// Optional fields are unset when Android reports them as unavailable.
message Record {
  // `SystemClock.elapsedRealtimeNanos()` when the app received it.
  int64 received_elapsed_realtime_ns = 1;
  oneof payload {
    GnssMeasurementsEvent gnss_measurements = 2;
    GnssStatus gnss_status = 3;
    GnssNavigationMessage gnss_navigation_message = 4;
    Location location = 5;
    CellInfoSnapshot cell_info = 6;
    ServiceState service_state = 7;
    SignalStrength signal_strength = 8;
    WifiScan wifi_scan = 9;
    ManualEvent manual_event = 10;
    BatteryStatus battery = 11;
    GnssMeasurementsStatus gnss_measurements_status = 12;
    GnssCapabilities gnss_capabilities = 13;
    GnssAntennaInfos gnss_antenna_infos = 14;
    ThermalStatus thermal = 15;
    BleScanResults ble_scan = 16;
    RecorderError recorder_error = 17;
  }
}

message GnssMeasurementsEvent {
  GnssClock clock = 1;
  repeated GnssMeasurement measurements = 2;
  // `GnssMeasurementsEvent.hasIsFullTracking` / `isFullTracking` (API 34).
  optional bool is_full_tracking = 3;
}

// `android.location.GnssClock`.
message GnssClock {
  int64 time_nanos = 1;
  optional double time_uncertainty_nanos = 2;
  optional int32 leap_second = 3;
  optional int64 full_bias_nanos = 4;
  optional double bias_nanos = 5;
  optional double bias_uncertainty_nanos = 6;
  optional double drift_nanos_per_second = 7;
  optional double drift_uncertainty_nanos_per_second = 8;
  int32 hardware_clock_discontinuity_count = 9;
  optional int64 elapsed_realtime_nanos = 10;
  optional double elapsed_realtime_uncertainty_nanos = 11;
  optional double reference_carrier_frequency_hz_for_isb = 12;
  optional string reference_code_type_for_isb = 13;
  optional int32 reference_constellation_type_for_isb = 14;
}

// `android.location.GnssMeasurement`.
message GnssMeasurement {
  int32 svid = 1;
  int32 constellation_type = 2;
  double time_offset_nanos = 3;
  int32 state = 4;
  int64 received_sv_time_nanos = 5;
  int64 received_sv_time_uncertainty_nanos = 6;
  double cn0_dbhz = 7;
  optional double baseband_cn0_dbhz = 8;
  double pseudorange_rate_meters_per_second = 9;
  double pseudorange_rate_uncertainty_meters_per_second = 10;
  int32 accumulated_delta_range_state = 11;
  double accumulated_delta_range_meters = 12;
  double accumulated_delta_range_uncertainty_meters = 13;
  optional float carrier_frequency_hz = 14;
  int32 multipath_indicator = 15;
  optional double snr_in_db = 16;
  optional double automatic_gain_control_level_db = 17;
  optional string code_type = 18;
  optional double full_inter_signal_bias_nanos = 19;
  optional double full_inter_signal_bias_uncertainty_nanos = 20;
  optional double satellite_inter_signal_bias_nanos = 21;
  optional double satellite_inter_signal_bias_uncertainty_nanos = 22;
}

// `GnssMeasurementsEvent.Callback.onStatusChanged`.
message GnssMeasurementsStatus {
  int32 status = 1;
}

// `android.location.GnssStatus`, one entry per satellite.
message GnssStatus {
  repeated GnssSatellite satellites = 1;
}

message GnssSatellite {
  int32 svid = 1;
  int32 constellation_type = 2;
  float cn0_dbhz = 3;
  float elevation_degrees = 4;
  float azimuth_degrees = 5;
  bool has_almanac = 6;
  bool has_ephemeris = 7;
  bool used_in_fix = 8;
  optional float carrier_frequency_hz = 9;
  optional float baseband_cn0_dbhz = 10;
}

// `android.location.GnssNavigationMessage`.
message GnssNavigationMessage {
  int32 svid = 1;
  int32 type = 2;
  int32 status = 3;
  int32 message_id = 4;
  int32 submessage_id = 5;
  bytes data = 6;
}

// `android.location.Location`.
message Location {
  string provider = 1;
  int64 time_ms = 2;
  int64 elapsed_realtime_nanos = 3;
  optional double elapsed_realtime_uncertainty_nanos = 4;
  double latitude_degrees = 5;
  double longitude_degrees = 6;
  optional double altitude_meters = 7;
  optional double msl_altitude_meters = 8;
  optional float msl_altitude_accuracy_meters = 9;
  optional float speed_meters_per_second = 10;
  optional float bearing_degrees = 11;
  optional float horizontal_accuracy_meters = 12;
  optional float vertical_accuracy_meters = 13;
  optional float speed_accuracy_meters_per_second = 14;
  optional float bearing_accuracy_degrees = 15;
  bool is_mock = 16;
}

// `TelephonyManager.requestCellInfoUpdate` results: everything the modem currently sees.
message CellInfoSnapshot {
  repeated Cell cells = 1;
}

message Cell {
  // `lte`, `nr`, `gsm`, `wcdma`, `tdscdma`, `cdma`, or the class name for anything else.
  string kind = 1;
  bool registered = 2;
  int32 connection_status = 3;
  // `CellInfo.getTimestampMillis`, elapsed realtime when the modem measured it.
  int64 timestamp_ms = 4;
  string mcc = 5;
  string mnc = 6;
  // LTE CI, NR NCI, GSM/WCDMA CID; unset if unavailable.
  optional int64 cell_id = 7;
  optional int32 pci = 8;
  optional int32 tac = 9;
  optional int32 arfcn = 10;
  repeated int32 bands = 11;
  int32 dbm = 12;
  int32 asu_level = 13;
  int32 level = 14;
  // `CellInfo.toString()`, which includes every field Android exposes, for anything not parsed above.
  string raw = 15;
}

// `TelephonyCallback.ServiceStateListener`.
message ServiceState {
  int32 state = 1;
  bool roaming = 2;
  string operator_numeric = 3;
  // `ServiceState.toString()`, including registration info per network.
  string raw = 4;
}

// `TelephonyCallback.SignalStrengthsListener`.
message SignalStrength {
  int32 level = 1;
  string raw = 2;
}

message WifiScan {
  // Whether this app requested the scan (as opposed to results from someone else's scan).
  bool requested = 1;
  repeated WifiResult results = 2;
}

// `android.net.wifi.ScanResult`.
message WifiResult {
  string bssid = 1;
  string ssid = 2;
  int32 frequency_mhz = 3;
  int32 level_dbm = 4;
  // Microseconds since boot when this result was last seen.
  int64 timestamp_us = 5;
  int32 channel_width = 6;
  int32 wifi_standard = 7;
}

message ManualEvent {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_BOARDED = 1;
    KIND_AT_STATION = 2;
    KIND_ALIGHTED = 3;
    KIND_NOTE = 4;
    KIND_DOORS_OPEN = 5;
    KIND_DOORS_CLOSED = 6;
  }
  Kind kind = 1;
  string text = 2;
}

// `BatteryManager` and the sticky `ACTION_BATTERY_CHANGED` broadcast.
message BatteryStatus {
  int32 level = 1;
  int32 scale = 2;
  int32 status = 3;
  int32 plugged = 4;
  // Tenths of a degree Celsius.
  int32 temperature_decidegrees_c = 5;
  int32 voltage_mv = 6;
  optional int32 current_now_ua = 7;
  optional int32 charge_counter_uah = 8;
}

// Lossless 16-bit little-endian PCM, interleaved if multi-channel.
message AudioChunk {
  // Index of the first frame (sample per channel) in this chunk since the stream started.
  int64 first_frame = 1;
  bytes pcm_s16le = 2;
  // `AudioRecord.getTimestamp` with `TIMEBASE_BOOTTIME`, to place frames on the elapsed realtime clock.
  repeated AudioTimestamp timestamps = 3;
  int64 written_elapsed_realtime_ns = 4;
}

message AudioTimestamp {
  int64 frame_position = 1;
  int64 boottime_ns = 2;
}

// `LocationManager.getGnssCapabilities`, `getGnssHardwareModelName`, and `getGnssYearOfHardware`, once per session.
message GnssCapabilities {
  // Every boolean capability, by its `GnssCapabilities` getter name without "has" (e.g. "MeasurementCorrections"),
  // so new ones need no schema change.
  map<string, bool> flags = 1;
  optional string hardware_model_name = 2;
  int32 year_of_hardware = 3;
}

// `LocationManager.registerAntennaInfoListener`: the antennas' phase center offsets and corrections,
// which carrier-phase processing needs.
message GnssAntennaInfos {
  repeated GnssAntennaInfo antennas = 1;
}

message GnssAntennaInfo {
  double carrier_frequency_mhz = 1;
  // Millimeters, in the phone's frame.
  double phase_center_offset_x_mm = 2;
  double phase_center_offset_x_uncertainty_mm = 3;
  double phase_center_offset_y_mm = 4;
  double phase_center_offset_y_uncertainty_mm = 5;
  double phase_center_offset_z_mm = 6;
  double phase_center_offset_z_uncertainty_mm = 7;
  optional SphericalCorrections phase_center_variation_corrections = 8;
  optional SphericalCorrections signal_gain_corrections = 9;
}

// `GnssAntennaInfo.SphericalCorrections`: a grid over zenith (rows) and azimuth (columns), row-major.
message SphericalCorrections {
  int32 rows = 1;
  int32 columns = 2;
  repeated double corrections = 3;
  repeated double uncertainties = 4;
  double delta_theta_degrees = 5;
  double delta_phi_degrees = 6;
}

// `PowerManager.getCurrentThermalStatus` and `getThermalHeadroom`: IMU bias drifts with temperature,
// and Android exposes no IMU temperature, so this and the battery temperature stand in for it.
message ThermalStatus {
  int32 status = 1;
  // `getThermalHeadroom(0)`: 1.0 is throttling; unset when Android returns NaN (e.g. called too often).
  optional float headroom = 2;
}

// Bluetooth LE advertisements, batched by the controller.
message BleScanResults {
  repeated BleScanResult results = 1;
  // From the scan with filters for known beacon formats, which Android keeps running with the screen off;
  // otherwise from the unfiltered scan, which Android pauses while the screen is off.
  bool filtered = 2;
}

// `android.bluetooth.le.ScanResult`.
message BleScanResult {
  string address = 1;
  int32 rssi = 2;
  int64 timestamp_elapsed_realtime_ns = 3;
  // The whole advertisement, as received, so any beacon format can be decoded later.
  bytes advertising_data = 4;
  optional int32 tx_power = 5;
  int32 primary_phy = 6;
  int32 secondary_phy = 7;
  int32 advertising_sid = 8;
  int32 periodic_advertising_interval = 9;
  bool connectable = 10;
  int32 data_status = 11;
}

// Something in the app failed while recording (a sensor, an Android API, a write), so analysis knows what's missing.
// The app keeps everything else going; repeats of the same error are recorded at 1, 2, 4, 8, ... occurrences.
message RecorderError {
  // What failed, e.g. "sensor accel_uncal" or "radio cell info".
  string source = 1;
  // The exception, with its message.
  string message = 2;
  // How many times this source has failed so far.
  int64 count = 3;
}
